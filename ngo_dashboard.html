{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">NGO Portal Dashboard</h3>
            <p class="text-muted small mb-0">Manage incoming donation requests and verification</p>
        </div>
        <button class="btn btn-primary rounded-3 fw-bold">
            <i class="fa-solid fa-plus me-1"></i> Create Request
        </button>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h5 class="fw-bold mb-3">Incoming Deliveries</h5>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Tracking ID</th>
                        <th>Donor Name</th>
                        <th>Resource Category</th>
                        <th>Assigned Volunteer</th>
                        <th>Status</th>
                        <th>Verify</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="fw-bold">TRK1001</td>
                        <td>Alex Parker</td>
                        <td>Food Supplies</td>
                        <td>David Miller</td>
                        <td><span class="badge bg-warning text-dark">Arriving Today</span></td>
                        <td><button class="btn btn-sm btn-success rounded-2"><i class="fa-solid fa-check me-1"></i> Verify</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
