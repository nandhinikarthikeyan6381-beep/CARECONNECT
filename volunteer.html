{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center">
    <!-- Hero Photo -->
    <div class="mb-3">
        <img src="{{ url_for('static', filename='images/hero.jpg') }}" class="img-fluid" alt="Be a Hero" style="max-height: 220px;">
    </div>

    <h2 class="fw-bold text-primary mb-2">Be a Hero for Someone Today!</h2>
    <p class="text-muted mb-4 mx-auto" style="max-width: 600px;">
        Join our team of dedicated volunteers to collect, verify, and deliver essential resources to NGOs across the city.
    </p>

    <a href="{{ url_for('register') }}" class="btn btn-success btn-lg fw-bold rounded-3 px-5 shadow-sm">Register as Volunteer</a>
</div>
{% endblock %}
